<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Odonto App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fb;
      color: #1f2937;
      text-align: center;
    }

    header {
      background: #2563FF;
      color: white;
      padding: 32px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 40px;
    }

    header p {
      font-size: 18px;
    }

    section {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    video {
      width: 100%;
      max-width: 700px;
      border-radius: 12px;
      box-shadow: 0 4px 15px #0002;
    }

    .screens img {
      width: 250px;
      margin: 10px;
      border-radius: 12px;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: #2563FF;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>

</head>

<body>

<header>
  <h1>Odonto App</h1>
  <p>Aplicativo para gerenciamento de clínicas odontológicas</p>
</header>


<section>

<h2>Demonstração</h2>

<video controls>
  <source src="assets/demo/video.mp4" type="video/mp4">
  Seu navegador não suporta vídeo.
</video>


<h2>Principais funcionalidades</h2>

<p>
Organização de pacientes, procedimentos, agenda e controle financeiro.
</p>


<h2>Telas do aplicativo</h2>

<div class="screens">

<img src="assets/demo/principal.jpeg">
<img src="assets/demo/pacientes.jpeg">
<img src="assets/demo/agenda.jpeg">

</div>


<a class="button" href="https://github.com/oanbifa-del/odonto-app">
Ver código no GitHub
</a>

</section>

</body>
</html>
